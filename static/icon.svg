<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4338ca"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e1b4b" flood-opacity="0.3"/>
    </filter>
  </defs>
  
  <!-- Arka Plan Köşeleri Yuvarlatılmış Kare -->
  <rect width="512" height="512" rx="110" fill="url(#bgGrad)"/>
  
  <!-- Not Defteri Gövdesi -->
  <g filter="url(#shadow)">
    <!-- Defter Arka Kapak -->
    <rect x="120" y="96" width="272" height="320" rx="20" fill="#ffffff"/>
    
    <!-- Defter Sol Cilt Şeridi -->
    <path d="M 120 116 C 120 105 129 96 140 96 L 165 96 L 165 416 L 140 416 C 129 416 120 407 120 396 Z" fill="#e0e7ff"/>
    
    <!-- Cilt Dikiş / Spiralleri -->
    <circle cx="142" cy="140" r="7" fill="#6366f1"/>
    <circle cx="142" cy="190" r="7" fill="#6366f1"/>
    <circle cx="142" cy="240" r="7" fill="#6366f1"/>
    <circle cx="142" cy="290" r="7" fill="#6366f1"/>
    <circle cx="142" cy="340" r="7" fill="#6366f1"/>
    <circle cx="142" cy="390" r="7" fill="#6366f1"/>
    
    <!-- Defter Satırları -->
    <rect x="195" y="160" width="160" height="12" rx="6" fill="#cbd5e1"/>
    <rect x="195" y="205" width="130" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="195" y="250" width="150" height="12" rx="6" fill="#e2e8f0"/>
    <rect x="195" y="295" width="110" height="12" rx="6" fill="#e2e8f0"/>
  </g>
  
  <!-- Kalem İkonu -->
  <g transform="translate(310, 270) rotate(-45)">
    <rect x="0" y="0" width="28" height="90" rx="4" fill="#f59e0b"/>
    <polygon points="0,90 28,90 14,120" fill="#fbbf24"/>
    <polygon points="10,112 18,112 14,120" fill="#1e293b"/>
    <rect x="0" y="-12" width="28" height="14" rx="3" fill="#ef4444"/>
  </g>
</svg>
